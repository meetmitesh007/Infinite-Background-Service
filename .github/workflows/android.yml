name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: 'gradle'

    # This steps upgrades your project settings to versions that actually exist on Google's servers
    - name: Force Upgrade Project Dependencies
      run: |
        find . -name "build.gradle" -exec sed -i "s#jcenter()#maven { url 'https://google.com' }\n        mavenCentral()#g" {} +
        find . -name "build.gradle" -exec sed -i "s#com.android.tools.build:gradle:2.3.3#com.android.tools.build:gradle:3.0.1#g" {} +
        find . -name "gradle-wrapper.properties" -exec sed -i "s#gradle-3.3-all.zip#gradle-4.1-all.zip#g" {} +

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
