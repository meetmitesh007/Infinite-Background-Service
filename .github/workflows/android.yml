name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # This completely cleans out dead repository links using safe text formatting (#)
    - name: Clean and Repair Legacy Repositories
      run: |
        find . -name "*.gradle" -exec sed -i 's#jcenter()#mavenCentral()\n        maven { url "https://google.com" }#g' {} +
        find . -name "*.gradle" -exec sed -i 's#mavenCentral()#mavenCentral()\n        maven { url "https://google.com" }#g' {} +
        echo "systemProp.org.gradle.internal.http.connectionTimeout=60000" >> gradle.properties
        echo "systemProp.org.gradle.internal.http.socketTimeout=60000" >> gradle.properties

    - name: Grant Execute Permission for Gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/*.apk
          build/outputs/apk/**/*.apk
          
